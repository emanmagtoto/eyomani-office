<!DOCTYPE html><html><head><meta charset="utf-8"><title>EYOMANI STUDIO — Floor 1</title>

<style>

#hdr{position:fixed;top:0;left:0;right:0;background:#0b0b0b;color:#d4af37;padding:10px 18px;font-weight:700;letter-spacing:3px;font-size:18px;border-bottom:2px solid #d4af37;z-index:5}
#log{position:fixed;right:12px;top:54px;width:330px;background:rgba(10,10,10,.88);color:#eee;border:1px solid #d4af37;border-radius:6px;font-size:12px;z-index:5}

#log.c ul{display:none}#log li b{color:#d4af37}
